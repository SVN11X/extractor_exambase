name: Actualizar catálogo de proveedores
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Slug de proveedor; all actualiza el siguiente del turno
        type: string
        default: all
        required: true
  schedule:
    - cron: '17 2 * * 1'
      timezone: America/Santiago
permissions:
  contents: write
concurrency:
  group: exambase-bancos
  queue: max
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/ejecutar
        with:
          tarea: catalogo
          vendor: ${{ inputs.vendor || 'all' }}
