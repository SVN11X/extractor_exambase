name: Actualizar catálogo de ExamBase
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Slug del proveedor o all para todos
        type: string
        default: all
        required: true
      delay:
        description: Pausa entre peticiones, de 5 a 120 segundos
        type: number
        default: 5
        required: true
permissions:
  contents: write
concurrency:
  group: exambase-trabajo
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VENDOR: ${{ inputs.vendor }}
      DELAY: ${{ inputs.delay }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Leer metadatos
        run: python actualizar_catalogo.py --vendor "$VENDOR" --delay "$DELAY"
      - name: Conservar catálogo recuperado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar metadatos del catálogo ExamBase"
            git push
          fi
