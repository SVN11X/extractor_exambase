name: Extraer exámenes por proveedor
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Slug del proveedor; consulta catalogos/catalogo.json
        required: true
        type: string
        default: google-cloud
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Santiago
permissions:
  contents: write
concurrency:
  group: exambase-bancos
  queue: max
jobs:
  proveedor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/ejecutar
        with:
          tarea: ${{ github.event_name == 'schedule' && 'automatico' || 'proveedor' }}
          vendor: ${{ inputs.vendor || 'all' }}
