name: Publicar frontend en GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/publicar-pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
