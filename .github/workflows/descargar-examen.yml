name: Actualizar un examen
on:
  workflow_dispatch:
    inputs:
      exam_url:
        description: URL del examen o de una página de sus preguntas
        required: true
        type: string
        default: https://www.exambase.com/exams/google/professional-data-engineer
permissions:
  contents: write
concurrency:
  group: exambase-bancos
  queue: max
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/ejecutar
        with:
          tarea: examen
          exam_url: ${{ inputs.exam_url }}
