name: Recopilación con Scrapling
description: Instalación, cola, archivo y conservación del banco vigente
inputs:
  tarea:
    description: examen, proveedor, automatico o catalogo
    required: true
  exam_url:
    description: URL de examen para actualización individual
    default: ''
  vendor:
    description: Slug para proveedor o catálogo
    default: all
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Preparar Scrapling
      shell: bash
      run: |
        python -m pip install -r requirements_actions.txt -r requirements_scrapling.txt
        python -m patchright install --with-deps chromium
        sudo apt-get update
        sudo apt-get install -y xvfb xauth tesseract-ocr tesseract-ocr-eng
    - name: Ejecutar tarea
      shell: bash
      env:
        TAREA: ${{ inputs.tarea }}
        EXAM_URL: ${{ inputs.exam_url }}
        VENDOR: ${{ inputs.vendor }}
        PYTHONUNBUFFERED: '1'
      run: |
        case "$TAREA" in
          examen) xvfb-run -a python acciones.py examen --exam-url "$EXAM_URL" ;;
          proveedor) xvfb-run -a python acciones.py proveedor --vendor "$VENDOR" ;;
          automatico) xvfb-run -a python acciones.py automatico ;;
          catalogo) xvfb-run -a python acciones.py catalogo --vendor "$VENDOR" ;;
          *) echo 'Tarea desconocida'; exit 1 ;;
        esac
    - name: Conservar bancos y avance
      if: always()
      shell: bash
      env:
        BANK_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- bancos catalogos automatizacion/estado.json
        if ! git diff --cached --quiet; then
          git commit -m 'Actualizar bancos y cola de ExamBase'
          git pull --rebase origin "$BANK_BRANCH"
          git push origin "HEAD:$BANK_BRANCH"
        fi
    - name: Descargar resultados y diagnóstico
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: exambase-resultado
        path: salida/
        if-no-files-found: warn
        retention-days: 14
